<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel de imersão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<svg id="bg" preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true"></svg>

<div class="container">
  <header class="top">
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo"></p>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="progText"></span><span id="saveState">salvo</span></div>
      <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    </div>
  </header>

  <div class="toolbar">
    <span style="flex:1"></span>
    <div class="dd">
      <button type="button">⋯ Dados ▾</button>
      <div class="dd-menu">
        <button type="button" data-acao="exportar-json">⬇ Exportar (.json)</button>
        <button type="button" data-acao="importar-json">⬆ Importar (.json)</button>
        <button type="button" data-acao="exportar-resumo">📄 Exportar resumo (.txt)</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" class="hidden">
  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>

  <footer>
    <span class="footer-text" id="rodape"></span>
    <button class="reset" type="button" data-acao="limpar">limpar tudo</button>
  </footer>
</div>

<script src="dados.js"></script>
<script src="motor.js"></script>
</body>
</html>
